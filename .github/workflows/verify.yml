name: Verify

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact revision or release PR ref to verify
        type: string
        required: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Record the verified revision
        run: |
          echo "Verified revision: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Install locked dependencies
        run: npm ci
      - name: Build and check the site
        run: npm run verify
